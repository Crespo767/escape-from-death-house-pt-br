name: Release Module

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-module
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install validation dependencies
        run: npm ci
      - name: Validate controls and both compendium import paths
        run: npm test
      - name: Prepare and validate Foundry package
        id: package
        run: |
          node tools/package.mjs
          echo "tag=v$(jq -r .version package/module.json)" >> "$GITHUB_OUTPUT"
      - name: Create installation archive
        working-directory: package
        run: zip -r ../escape-from-death-house-pt-br.zip escape-from-death-house-pt-br
      - name: Verify archive contents and matching manifests
        run: |
          unzip -p escape-from-death-house-pt-br.zip escape-from-death-house-pt-br/module.json > package/zipped-module.json
          cmp package/module.json package/zipped-module.json
          unzip -l escape-from-death-house-pt-br.zip | grep 'scripts/controls.mjs'
          unzip -l escape-from-death-house-pt-br.zip | grep 'scripts/control-data.mjs'
          unzip -l escape-from-death-house-pt-br.zip | grep 'macros/atualizar-controles.js'
      - name: Publish Foundry installation assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "${{ steps.package.outputs.tag }} - Fuga da Casa da Morte (PT-BR)"
          body_path: docs/release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            escape-from-death-house-pt-br.zip
            package/module.json
